# 1) original code: HSV, original (batch-axis, no residual) attention
runpod:
  gpu: "RTX 3090"
  gpu_count: 1
  cloud: community
  max_hours: 2.5
  image: runpod/pytorch:2.2.0-cu1281-torch291-ubuntu2404
  container_disk_gb: 30
  auto_approve_under_usd: 0
train:
  entry: python3 train.py --config configs/baseline.yaml
  dataset: hf:huggan/flowers-102-categories@e8e6f53dc08d354a409c003af6e6df5fba2b293c
experiment:
  color_space: hsv
  attn_fix: false
  max_epochs: 200
  batch_size: 512
  accelerator: gpu
