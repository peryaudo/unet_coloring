# 4) attention fix + Lab color space (predict ab from L)
runpod:
  gpu: "RTX A6000"
  gpu_count: 1
  cloud: community
  max_hours: 2.5
  image: runpod/pytorch:2.2.0-cu1281-torch291-ubuntu2404
  container_disk_gb: 30
  auto_approve_under_usd: 0
train:
  entry: python3 train.py --config configs/lab.yaml
  dataset: hf:huggan/flowers-102-categories@e8e6f53dc08d354a409c003af6e6df5fba2b293c
experiment:
  color_space: lab
  attn_fix: true
  max_epochs: 200
  batch_size: 512
  accelerator: gpu
